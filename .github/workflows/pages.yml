name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check site files and local references
        run: python3 scripts/check_site.py

      - name: Prepare static site
        if: github.event_name == 'push'
        run: |
          mkdir _site
          cp index.html design-practice.html styles.css script.js _site/
          cp -R games _site/games
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Check deployment artifact
        if: github.event_name == 'push'
        env:
          SITE_ROOT: _site
        run: python3 scripts/check_site.py

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
